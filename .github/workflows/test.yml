name: Model Smoke

on:
  schedule:
    # Keep remote artifacts and real inference out of pull-request CI.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      run_metal:
        description: Run the explicit Metal smoke after the CPU model smoke
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One workflow run and one model-loading test process at a time.
concurrency:
  group: model-smoke
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  OMP_NUM_THREADS: "2"
  RAYON_NUM_THREADS: "2"
  CANDLE_NUM_THREADS: "2"
  RUST_BACKTRACE: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  cpu-model:
    name: CPU / representative retrieval paths
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install repository-pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Load and encode with BGE base v1.5 on CPU
        run: >-
          cargo test --locked --offline --no-default-features
          --test test_dense_encoder test_dense_encoder_single --
          --ignored --exact --nocapture --test-threads=1

      - name: Run the opted-in Nomic extended-context smoke on CPU
        run: >-
          cargo test --locked --offline --no-default-features
          --test test_dense_encoder test_nomic_dense_above_default_context --
          --ignored --exact --nocapture --test-threads=1

      # Each checkpoint gets its own process. This preserves the on-disk cache
      # without retaining multiple model copies in one address space.
      - name: Load and encode with ColBERT Small on CPU
        run: >-
          cargo test --locked --offline --no-default-features
          --test test_multivector_encoder test_colbert_small_single --
          --ignored --exact --nocapture --test-threads=1

      - name: Load and encode with SPLADE PP v1 on CPU
        run: >-
          cargo test --locked --offline --no-default-features
          --test sparse_embeddings_test test_sparse_encode_single --
          --ignored --exact --nocapture --test-threads=1

  metal-model:
    name: Metal / BGE base
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_metal }}
    needs: cpu-model
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install repository-pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Require a Metal-capable runner
        run: |
          system_profiler SPDisplaysDataType > "$RUNNER_TEMP/displays.txt"
          grep -q "Metal" "$RUNNER_TEMP/displays.txt"

      - name: Load and encode explicitly on Metal
        shell: bash
        run: |
          set -o pipefail
          metal_log="$RUNNER_TEMP/metal-smoke.log"

          cargo test --locked --offline --no-default-features --features metal \
            --test dense_embeddings_test test_device_metal_on_macos -- \
            --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$metal_log"

          if grep -Fq "Metal device not available, skipping test" "$metal_log" || \
             grep -Fq "falling back to CPU" "$metal_log"; then
            echo "Metal smoke did not execute on Metal" >&2
            exit 1
          fi

          grep -Eq "test result: ok\\. 1 passed; 0 failed; 0 ignored" "$metal_log"
