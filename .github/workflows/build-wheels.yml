name: Build Python Wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the completed artifacts to PyPI after environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: python-wheels-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install pinned lock checker
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: uv==0.9.25

      - name: Check Python dependency lock
        run: uv lock --check

      - name: Check package version consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          python = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          cargo_version = cargo["package"]["version"]
          python_version = python["project"]["version"]
          if cargo_version != python_version:
              raise SystemExit(
                  f"version mismatch: Cargo.toml={cargo_version}, "
                  f"pyproject.toml={python_version}"
              )
          print(f"package version: {cargo_version}")
          PY

      - name: Verify locked Rust workspace
        shell: bash
        run: |
          git ls-files --error-unmatch Cargo.lock
          rustc --version --verbose
          cargo metadata --locked --no-deps --format-version 1 > /dev/null

  linux:
    name: Linux ${{ matrix.target }} / CPython ${{ matrix.python }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        # PyO3 0.22 supports CPython through 3.13. Python 3.14 needs a PyO3 upgrade.
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: >-
            --release --locked --out dist
            --no-default-features --features python
            --compatibility pypi
            --interpreter python${{ matrix.python }}
          maturin-version: 'v1.13.3'
          sccache: 'true'
          manylinux: '2_28'

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-linux-${{ matrix.target }}-cp${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  windows:
    name: Windows x64 / CPython ${{ matrix.python }}
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x64
          args: >-
            --release --locked --out dist
            --no-default-features --features python
            --interpreter python
          maturin-version: 'v1.13.3'
          sccache: 'true'

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-windows-x64-cp${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target }} / CPython ${{ matrix.python }}
    needs: validate
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: >-
            --release --locked --out dist
            --no-default-features --features python
            --interpreter python
          maturin-version: 'v1.13.3'
          sccache: 'true'

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-macos-${{ matrix.target }}-cp${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --locked --out dist
          maturin-version: 'v1.13.3'

      - name: Upload source distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: ${{ inputs.publish == true }}
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tessera-embeddings
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
