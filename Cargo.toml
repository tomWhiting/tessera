[package]
name = "tessera-embeddings"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Multi-paradigm embedding library for dense, sparse, multi-vector, and vision-language retrieval"
repository = "https://github.com/tomWhiting/tessera"
homepage = "https://github.com/tomWhiting/tessera"
documentation = "https://docs.rs/tessera-embeddings"
keywords = ["embeddings", "colbert", "semantic-search", "ml", "nlp"]
categories = ["science", "text-processing"]
exclude = [
    "/CODE_QUALITY_REPORT.md",
    "/OPTIMIZATION_PLAN.md",
    "/PUBLICATION_SUMMARY.md",
    "/docs/archive/**",
    "/docs/vision_board/**",
    "/docs/ARCHITECTURE_REVIEW.md",
    "/docs/CHRONOS_BOLT_*.md",
    "/docs/COLPALI_SHAPE_FIX.md",
    "/docs/COMPLETION_PLAN.md",
    "/docs/PHASE_0_*.md",
    "/docs/PYENTRY_*.md",
    "/docs/PYTHON_BINDINGS_COMPLETE.md",
    "/docs/TESSERA_ARCHITECTURE_PYENTRY.md",
    "/examples/fixtures/**",
    "/tests/*.md",
]

[workspace]
members = [".", "xtask"]
resolver = "2"

[lib]
name = "tessera"  # Keep as "tessera" so users can `use tessera::...`
crate-type = ["cdylib", "rlib"]  # cdylib for Python, rlib for Rust

[[bin]]
name = "tessera"
path = "src/main.rs"

[features]
default = ["pdf"]  # PDF support enabled by default for ColPali document processing
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "dep:candle-metal-kernels",
]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
pdf = ["pdf2image"]  # PDF rendering support for ColPali document processing
python = ["dep:pyo3", "dep:numpy"]  # PyO3 bindings over supported embedding models
wasm = []    # WebAssembly bindings (TODO: add wasm-bindgen when implementing)
timeseries = []  # Generic time-series types only; the legacy Chronos runtime is quarantined

[dependencies]
anyhow = "1.0.100"
candle-core = "0.11.0"
candle-metal-kernels = { version = "0.11.0", optional = true }
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
clap = { version = "4.5.49", features = ["derive"] }
hf-hub = { version = "0.4.3", default-features = false, features = ["tokio", "rustls-tls", "ureq"] }
ndarray = "0.16.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
safetensors = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokenizers = { version = "0.22.1", features = ["http"] }

# Vision/Image Processing (Phase 3.1 - ColPali)
image = "0.25"              # Image loading, format conversion, and resizing for vision models
imageproc = "0.25"          # Advanced image processing operations (filtering, transformations)
pdf2image = { version = "0.1.2", optional = true }  # PDF to image rendering (uses Poppler)
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
numpy = { version = "0.22", optional = true }

[build-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[lints.rust]
# Note: unsafe is allowed in specific backend code for FFI (candle, Metal)
# unsafe_code = "forbid"
missing_docs = "warn"   # Warn on missing documentation

[lints.clippy]
# Use warn level to allow build but highlight issues
all = "warn"
pedantic = "warn"
nursery = "warn"

# =============================================================================
# Build Profiles - Critical for GPU Performance
# =============================================================================

[profile.release]
opt-level = 3          # Maximum optimization
lto = "fat"            # Link-time optimization - critical for GPU code inlining
codegen-units = 1      # Single codegen unit for better optimization
strip = "symbols"      # Strip symbols for smaller binary
panic = "abort"        # Abort on panic (no unwinding overhead)

[profile.dev]
opt-level = 1          # Some optimization even in dev for faster iteration

[profile.bench]
inherits = "release"   # Use release settings for benchmarks

[profile.release-with-debug]
inherits = "release"
debug = true           # Keep debug symbols for profiling
