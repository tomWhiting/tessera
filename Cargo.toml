[package]
name = "tessera-embeddings"
version = "0.2.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
description = "Experimental embedding library for dense, sparse, multi-vector, and vision-language retrieval"
repository = "https://github.com/tomWhiting/tessera"
homepage = "https://github.com/tomWhiting/tessera"
documentation = "https://docs.rs/tessera-embeddings"
keywords = ["embeddings", "colbert", "semantic-search", "ml", "nlp"]
categories = ["science", "text-processing"]
exclude = [
    "/.cargo/**",
    "/CODE_QUALITY_REPORT.md",
    "/OPTIMIZATION_PLAN.md",
    "/PUBLICATION_SUMMARY.md",
    "/scripts/**",
    "/docs/archive/**",
    "/docs/vision_board/**",
    "/docs/ARCHITECTURE_REVIEW.md",
    "/docs/CHRONOS_BOLT_*.md",
    "/docs/COLPALI_SHAPE_FIX.md",
    "/docs/COMPLETION_PLAN.md",
    "/docs/PHASE_0_*.md",
    "/docs/PYENTRY_*.md",
    "/docs/PYTHON_BINDINGS_COMPLETE.md",
    "/docs/TESSERA_ARCHITECTURE_PYENTRY.md",
    "/examples/fixtures/**",
    "/tests/*.md",
]

[workspace]
members = [".", "xtask"]
resolver = "2"

[lib]
name = "tessera"  # Keep as "tessera" so users can `use tessera::...`
crate-type = ["cdylib", "rlib"]  # cdylib for Python, rlib for Rust

[[bin]]
name = "tessera"
path = "src/main.rs"

[features]
default = []
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "dep:candle-metal-kernels",
]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
pdf = ["dep:pdf2image"]  # Opt-in PDF rendering; requires a system Poppler installation
python = ["dep:pyo3", "dep:numpy"]  # PyO3 bindings over experimental embedding adapters
timeseries = []  # Generic time-series types only; the legacy Chronos runtime is quarantined

[dependencies]
anyhow = "1.0.100"
candle-core = "0.11.0"
candle-metal-kernels = { version = "0.11.0", optional = true }
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
clap = { version = "4.5.49", features = ["derive"] }
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
ndarray = "0.16.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokenizers = "0.22.1"  # Artifacts are fetched by the pinned ModelFileResolver

# Vision and image processing
image = "0.25"              # Image loading, format conversion, and resizing for vision models
pdf2image = { version = "0.1.2", optional = true }  # PDF to image rendering (uses Poppler)
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
numpy = { version = "0.22", optional = true }

[build-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[lints.rust]
# Memory-mapped model loading contains narrowly scoped unsafe blocks.
missing_docs = "warn"   # Warn on missing documentation

[lints.clippy]
# Use warn level to allow build but highlight issues
all = "warn"
pedantic = "warn"
nursery = "warn"

# Balanced release profiles for native binaries and Python extension builds.

[profile.release]
opt-level = 3          # Optimize runtime hot paths
lto = "thin"           # Balanced link-time optimization without fat-LTO memory use
codegen-units = 8      # Preserve parallel code generation for bounded build times
strip = "symbols"      # Strip symbols for smaller binary
panic = "unwind"       # Let Rust and PyO3 boundaries report recoverable failures

[profile.dev]
opt-level = 1          # Some optimization even in dev for faster iteration

[profile.bench]
inherits = "release"   # Use release settings for benchmarks

[profile.release-with-debug]
inherits = "release"
debug = true           # Keep debug symbols for profiling
