[package]
name = "tessera-xtask"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
certification = [
    "dep:candle-core",
    "dep:clap",
    "dep:hf-hub",
    "dep:sha2",
    "dep:tessera",
]

[dependencies]
candle-core = { version = "0.11.0", optional = true }
clap = { version = "4.5.49", features = ["derive"], optional = true }
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq", "rustls-tls"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = { version = "0.10.9", optional = true }
tessera = { package = "tessera-embeddings", path = "..", default-features = false, optional = true }
